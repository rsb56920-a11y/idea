<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星詠みルナの占い館</title>
<meta name="description" content="天中殺・数秘術2027・推し相性・韓国式サジュ・タロット・オーラカラー。生年月日だけで、登録なしですぐ占えます。" />
<meta property="og:title" content="星詠みルナの占い館" />
<meta property="og:description" content="生年月日だけで、登録なしですぐ占える。2026-2027年の運勢に" />
<meta name="theme-color" content="#1f1a3a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" />
<style>
{{CSS}}
.list { display: grid; gap: 12px; margin-top: 20px; }
.item { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); color: var(--ink); text-decoration: none; transition: transform .2s; }
.item:hover { transform: translateY(-2px); }
.item b { font-size: 40px; }
.item strong { display: block; font-size: 18px; color: var(--gold); }
.item small { display: block; opacity: .85; line-height: 1.6; }
</style>
<script src="設定.js"></script>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <header class="hero">
    <div class="emoji">🔮</div>
    <h1 id="title">星詠みルナの占い館</h1>
    <p class="catch">生年月日だけで、登録なし・無料ですぐ占えます</p>
  </header>
  <div class="list">
{{CARDS}}
  </div>
  <footer>占いは楽しむためのものです。大切な判断はご自身で。</footer>
</main>
<script>
  if (window.URANAI && URANAI.siteName) { document.title = URANAI.siteName; document.getElementById("title").textContent = URANAI.siteName; }
  const cv = document.getElementById("sky"), c = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  for (let i = 0; i < (cv.width * cv.height) / 7000; i++) { c.globalAlpha = Math.random(); c.fillStyle = "#fff"; c.beginPath(); c.arc(Math.random() * cv.width, Math.random() * cv.height, Math.random() * 1.4 + .3, 0, 7); c.fill(); }
</script>
</body>
</html>
