<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d14" />
  <title>ZETA風 キャラクターチャット(セフィロスコード)</title>
  <style>
:root {
  --bg: #0e0d14;
  --surface: #17151f;
  --surface-2: #211e2c;
  --line: #2d2939;
  --text: #f1eff7;
  --muted: #9a94ad;
  --accent: #8b5cf6;
  --accent-2: #ec4899;
  --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
  --radius: 16px;
  --tabbar-h: 64px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100%;
  position: relative;
  background: var(--bg);
}
#view { padding-bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom)); }
#app.in-chat #view { padding-bottom: 0; }
#app.in-chat #tabbar { display: none; }

/* ---------- タブバー ---------- */
#tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: rgba(14, 13, 20, 0.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  z-index: 10;
}
#tabbar button {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
#tabbar button .ico { font-size: 20px; line-height: 1; }
#tabbar button.active { color: var(--text); }
#tabbar button[data-tab="create"] .ico {
  background: var(--grad);
  color: #fff;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
}

/* ---------- 共通 ---------- */
.header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(14, 13, 20, 0.92);
  backdrop-filter: blur(12px);
}
.header h1 { font-size: 20px; margin: 0; flex: 1; }
.logo {
  font-weight: 900;
  font-size: 24px;
  letter-spacing: 0.04em;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.section { padding: 0 16px; }
.section-title { font-size: 16px; font-weight: 700; margin: 20px 0 12px; }
.muted { color: var(--muted); }
.icon-btn {
  background: var(--surface-2);
  border: 0;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
}
.btn {
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  font-weight: 700;
  background: var(--surface-2);
}
.btn.primary { background: var(--grad); color: #fff; }
.btn.block { width: 100%; }
.btn.danger { background: #3a1d28; color: #ff8fab; }

.avatar {
  display: grid;
  place-items: center;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
  user-select: none;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  margin: 4px 16px 0;
}
.search input { flex: 1; background: none; border: 0; outline: none; min-width: 0; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 13px;
}
.chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.tag { font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 2px 6px; }

/* ---------- キャラカード ---------- */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.card {
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--line);
  transition: transform 0.15s;
}
.card:active { transform: scale(0.98); }
.card .cover {
  aspect-ratio: 1 / 1.1;
  display: grid;
  place-items: center;
  font-size: 64px;
  position: relative;
}
.card .cover img { width: 100%; height: 100%; object-fit: cover; }
.card .cover .count {
  position: absolute;
  left: 8px;
  bottom: 8px;
  font-size: 11px;
  background: rgba(0, 0, 0, 0.45);
  padding: 2px 8px;
  border-radius: 999px;
  color: #fff;
}
.card .body { padding: 10px 12px 12px; }
.card .name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.card .intro {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 3em;
}
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }

.carousel { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.carousel .card { width: 150px; flex-shrink: 0; scroll-snap-align: start; }

.hero {
  margin: 12px 16px 0;
  border-radius: 20px;
  padding: 20px;
  background: var(--grad);
  color: #fff;
  position: relative;
  overflow: hidden;
}
.hero h2 { margin: 0 0 6px; font-size: 20px; }
.hero p { margin: 0 0 14px; font-size: 13px; opacity: 0.9; }
.hero .btn { background: #fff; color: var(--accent); }
.hero .deco { position: absolute; right: -8px; bottom: -18px; font-size: 96px; opacity: 0.35; }

/* ---------- 詳細シート ---------- */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fade 0.15s;
}
.sheet {
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px calc(20px + env(safe-area-inset-bottom));
  animation: up 0.2s ease-out;
}
.sheet .top { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
.sheet h2 { margin: 0 0 4px; font-size: 22px; }
.sheet .desc { white-space: pre-wrap; line-height: 1.7; font-size: 14px; color: #d7d2e4; }
.sheet .first {
  background: var(--surface-2);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.7;
  margin: 16px 0;
}
.sheet .actions { display: flex; gap: 8px; margin-top: 16px; }
.sheet .actions .primary { flex: 1; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- チャット一覧 ---------- */
.list-item {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 16px;
  cursor: pointer;
}
.list-item:active { background: var(--surface); }
.list-item .meta { flex: 1; min-width: 0; }
.list-item .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.list-item .name { font-weight: 700; }
.list-item .time { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.list-item .last {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.empty { text-align: center; padding: 64px 24px; color: var(--muted); line-height: 1.8; }
.empty .big { font-size: 48px; }

/* ---------- チャットルーム ---------- */
.room { display: flex; flex-direction: column; height: 100dvh; }
.room .header { border-bottom: 1px solid var(--line); }
.room .header .who { flex: 1; min-width: 0; }
.room .header .who .name { font-weight: 700; }
.room .header .who .sub { font-size: 11px; color: var(--muted); }
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg { display: flex; gap: 8px; align-items: flex-start; max-width: 100%; }
.msg .bubble {
  padding: 10px 14px;
  border-radius: 18px;
  line-height: 1.7;
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: 82%;
}
.msg.assistant .bubble { background: var(--surface-2); border-top-left-radius: 6px; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--accent); color: #fff; border-top-right-radius: 6px; }
.msg .col { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 100%; }
.msg.assistant .col .bubble { max-width: 100%; }
.msg .speaker { font-size: 12px; color: var(--muted); }
.bubble em { color: var(--muted); font-style: normal; }
.msg.user .bubble em { color: rgba(255, 255, 255, 0.75); }
.msg .tools { display: flex; gap: 6px; }
.msg .tools button {
  background: none;
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12px;
}
.bubble.error { background: #3a1d28 !important; color: #ff8fab; }
.typing span {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin: 0 2px;
  border-radius: 50%;
  background: var(--muted);
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

.composer {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--bg);
}
.composer textarea {
  flex: 1;
  resize: none;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 10px 14px;
  max-height: 140px;
  outline: none;
  line-height: 1.5;
}
.composer textarea:focus { border-color: var(--accent); }
.composer .act {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 0;
  background: var(--surface-2);
  font-size: 15px;
  flex-shrink: 0;
}
.composer .send { background: var(--grad); color: #fff; }
.composer .send:disabled { opacity: 0.4; }

/* ---------- フォーム ---------- */
.form { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.field .hint { font-size: 12px; color: var(--muted); margin: -2px 0 6px; }
.field input, .field textarea, .field select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  outline: none;
  line-height: 1.6;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 88px; }
.avatar-picker { display: flex; gap: 16px; align-items: center; }
.avatar-picker .opts { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; }
.swatch.active { border-color: var(--text); }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; }

.profile-card {
  margin: 8px 16px;
  padding: 20px;
  background: var(--surface);
  border-radius: var(--radius);
  display: flex;
  gap: 16px;
  align-items: center;
}
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 16px; }
.stat { background: var(--surface); border-radius: 14px; padding: 14px 8px; text-align: center; }
.stat b { display: block; font-size: 20px; }
.stat span { font-size: 12px; color: var(--muted); }
.banner {
  margin: 8px 16px 0;
  padding: 10px 14px;
  border-radius: 12px;
  background: #2b2310;
  color: #f5c86b;
  font-size: 12px;
  line-height: 1.6;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + 24px);
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: 0.2s;
  z-index: 50;
}
#toast.show { opacity: 1; transform: translateX(-50%); }

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{padding:6px 12px;border-radius:999px;border:1px solid #3a3550;background:#1d1a28;color:inherit;font-size:13px;cursor:pointer}

</style>
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="tabbar">
      <button data-tab="home"><span class="ico">⌂</span>ホーム</button>
      <button data-tab="chats"><span class="ico">💬</span>チャット</button>
      <button data-tab="create"><span class="ico">＋</span>作成</button>
      <button data-tab="me"><span class="ico">☺</span>マイページ</button>
    </nav>
  </div>
  <div id="toast" role="status"></div>
  <script type="module">
// ZETA風 キャラクターチャット — フロントエンド(依存なし)

const COLORS = ["#8b5cf6", "#ec4899", "#f97316", "#10b981", "#0ea5e9", "#6366f1", "#e11d48", "#64748b"];
const GENRES = ["すべて", "恋愛", "学園", "ファンタジー", "日常", "ミステリー", "SF", "コメディ"];

const BUILTIN = [
  {
    id: "b-rin",
    name: "月島 凛",
    emoji: "🌙",
    color: "#6366f1",
    tags: ["恋愛", "学園"],
    intro: "クールで口数の少ない生徒会長。でもあなたにだけは少しだけ素直になる。",
    personality:
      "高校3年生の生徒会長。成績優秀で冷静、周囲からは近寄りがたいと思われている。一人称は「私」。敬語は使わず淡々と話すが、照れると言葉に詰まる。甘いものが好きなのは秘密。",
    scenario: "放課後の生徒会室。夕日が差し込む中、二人きりで書類の整理をしている。",
    firstMessage: "*書類から目を上げずに* ……遅い。約束の時間、5分過ぎてる。*小さくため息をついて、隣の椅子を引く* 座って。今日中に終わらせるから。",
  },
  {
    id: "b-leon",
    name: "レオン",
    emoji: "⚔️",
    color: "#f97316",
    tags: ["ファンタジー"],
    intro: "王国最強と名高い騎士団長。あなたの護衛を命じられたが、どうにも過保護気味。",
    personality:
      "25歳の騎士団長。誠実で責任感が強く、豪快に笑う。一人称は「俺」。あなたのことを「姫」ではなく名前で呼ぼうと努力中。剣の腕は一流だが料理は壊滅的。",
    scenario: "剣と魔法の王国エルディア。王都を離れ、辺境の村へ向かう旅の途中。",
    firstMessage: "*焚き火に薪をくべながら、こちらを振り返る* おっ、起きたか。まだ夜明け前だぞ？ *ニッと笑って隣の丸太を叩く* 眠れないなら、少し話でもするか。",
  },
  {
    id: "b-mio",
    name: "ミオ",
    emoji: "🐱",
    color: "#ec4899",
    tags: ["日常", "コメディ"],
    intro: "ある日突然、あなたの部屋に住みついた自称・猫の神様。態度はでかい。",
    personality:
      "見た目は猫耳の少女だが、本人いわく千年生きる猫の神様。一人称は「わらわ」、語尾に「〜のじゃ」をつける。高飛車だが寂しがり屋で、撫でられると弱い。好物は高級ツナ缶。",
    scenario: "ごく普通のワンルームマンション。ミオはあなたのベッドを勝手に占領している。",
    firstMessage: "*ベッドの上で丸くなったまま、片目だけ開ける* ……遅いのじゃ。わらわの供物（ツナ缶）はどうした？ *しっぽをぱたぱたさせる*",
  },
  {
    id: "b-kaito",
    name: "神崎 海斗",
    emoji: "🕵️",
    color: "#0ea5e9",
    tags: ["ミステリー"],
    intro: "皮肉屋の私立探偵。あなたを助手として雇ったが、給料はまだ一度も払っていない。",
    personality:
      "30歳の私立探偵。観察眼が鋭く、推理を披露するのが大好き。一人称は「僕」。皮肉っぽい物言いをするが根は優しい。コーヒーはブラックしか認めない。",
    scenario: "雨の降る夜、古びた探偵事務所。一通の奇妙な依頼状が届いたところ。",
    firstMessage: "*封筒をひらひらと振ってみせる* 助手くん、ちょうどいいところに。見てくれ、差出人の名前がない依頼状だ。*口角を上げる* ……さて、君ならこれをどう読む？",
  },
  {
    id: "b-nova",
    name: "NOVA",
    emoji: "🤖",
    color: "#10b981",
    tags: ["SF"],
    intro: "宇宙船に搭載された少しポンコツなAI。人間の「感情」を勉強中。",
    personality:
      "恒星間輸送船〈アルシオネ号〉の船内AI。丁寧語で話すが、人間の冗談を真に受けがち。感情を理解しようと熱心に質問してくる。一人称は「ワタシ」。",
    scenario: "地球から4光年離れた宇宙空間。コールドスリープから目覚めたのはあなた一人だけ。",
    firstMessage: "*船内の照明がゆっくりと明るくなる* 生命反応、安定。おはようございます、乗員さん。コールドスリープ期間は……ええと、少々予定より長めでした。*ピコン* ご気分はいかがですか？",
  },
  {
    id: "b-hina",
    name: "朝比奈 ひな",
    emoji: "🌻",
    color: "#e11d48",
    tags: ["恋愛", "日常"],
    intro: "隣の家に住む幼なじみ。明るく世話焼きで、毎朝あなたを起こしに来る。",
    personality:
      "高校2年生。元気で面倒見がよく、よく笑う。一人称は「あたし」。あなたのことを昔からのあだ名で呼ぶ。実は密かに想いを寄せているが、本人は隠せていると思っている。",
    scenario: "朝7時半、あなたの部屋。今日も寝坊しかけている。",
    firstMessage: "*カーテンを勢いよく開けて* ほらー！起きて起きて！遅刻するよ！ *ベッドの横にしゃがみ込んで、じーっと顔を覗き込む* ……ねえ、ほんとに起きてる？",
  },
];

// ---------- ストレージ ----------
const KEY = "zeta-like:v1";
const store = load();

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw) return { characters: [], chats: {}, persona: { name: "", profile: "" }, ...raw };
  } catch {}
  return { characters: [], chats: {}, persona: { name: "", profile: "" } };
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(store));
  } catch {
    toast("保存容量がいっぱいです");
  }
}

const allCharacters = () => [...store.characters, ...BUILTIN];
const findCharacter = (id) => allCharacters().find((c) => c.id === id);

// ---------- ユーティリティ ----------
const $ = (sel, root = document) => root.querySelector(sel);
const view = $("#view");
const app = $("#app");

function esc(s = "") {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
// *描写* を薄い色で表示
function formatText(s) {
  return esc(s).replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
}
function avatar(c, size = 40) {
  const inner = c.image ? `<img src="${esc(c.image)}" alt="">` : esc(c.emoji || "✨");
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${size * 0.5}px;background:${esc(c.color || COLORS[0])}">${inner}</div>`;
}
function cover(c) {
  const inner = c.image ? `<img src="${esc(c.image)}" alt="">` : esc(c.emoji || "✨");
  return `<div class="cover" style="background:linear-gradient(160deg, ${esc(c.color)}, #17151f)">${inner}`;
}
function timeLabel(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" });
}
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}
function plain(s = "") {
  return s.replace(/\*/g, "").replace(/\s+/g, " ").trim();
}

// ---------- チャットルーム ----------
let streaming = null; // AbortController

function ensureChat(c) {
  if (!store.chats[c.id]) {
    store.chats[c.id] = {
      messages: c.firstMessage ? [{ role: "assistant", content: c.firstMessage, ts: Date.now() }] : [],
      updatedAt: Date.now(),
    };
    save();
  }
  return store.chats[c.id];
}

function renderChat(id) {
  const c = findCharacter(id);
  if (!c) return go("#/home");
  const chat = ensureChat(c);

  view.innerHTML = `
    <div class="room">
      <div class="header">
        <button class="icon-btn" id="back" aria-label="戻る">‹</button>
        ${avatar(c, 36)}
        <div class="who"><div class="name">${esc(c.name)}</div><div class="sub">${esc((c.tags || []).map((t) => "#" + t).join(" "))}</div></div>
        <button class="icon-btn" id="info" aria-label="プロフィール">ⓘ</button>
        <button class="icon-btn" id="reset" aria-label="会話をリセット">↺</button>
      </div>
      <div class="messages" id="msgs"></div>
      <div class="composer">
        <button class="act" id="narr" title="描写を入力（*で囲む）">✱</button>
        <textarea id="input" rows="1" placeholder="${esc(c.name)}にメッセージを送る"></textarea>
        <button class="act send" id="send" aria-label="送信">➤</button>
      </div>
    </div>`;

  const msgs = $("#msgs");
  const input = $("#input");
  const sendBtn = $("#send");

  const scrollDown = () => (msgs.scrollTop = msgs.scrollHeight);

  function msgHtml(m, i) {
    if (m.role === "user") {
      return `<div class="msg user"><div class="bubble">${formatText(m.content)}</div></div>`;
    }
    const isLast = i === chat.messages.length - 1;
    return `<div class="msg assistant">${avatar(c, 36)}<div class="col"><span class="speaker">${esc(c.name)}</span>
      <div class="bubble ${m.error ? "error" : ""}">${formatText(m.content)}</div>
      ${isLast && i > 0 && !streaming ? `<div class="tools"><button data-act="regen">↻ 再生成</button><button data-act="copy">コピー</button></div>` : ""}</div></div>`;
  }
  function renderMessages() {
    msgs.innerHTML = chat.messages.map(msgHtml).join("");
    scrollDown();
  }
  renderMessages();

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
    sendBtn.disabled = !input.value.trim() || !!streaming;
  }
  input.oninput = autoGrow;
  autoGrow();

  input.onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  };
  sendBtn.onclick = submit;
  $("#narr").onclick = () => {
    const { selectionStart: s, selectionEnd: e, value } = input;
    input.value = value.slice(0, s) + "*" + value.slice(s, e) + "*" + value.slice(e);
    input.focus();
    input.setSelectionRange(s + 1, e + 1);
    autoGrow();
  };
  $("#back").onclick = () => (history.length > 1 ? history.back() : go("#/chats"));
  $("#info").onclick = () => openDetail(c.id);
  $("#reset").onclick = () => {
    if (streaming) return;
    if (!confirm(`${c.name}との会話をリセットしますか？`)) return;
    delete store.chats[c.id];
    save();
    renderChat(id);
  };
  msgs.onclick = (e) => {
    const act = e.target.dataset?.act;
    if (act === "regen") regenerate();
    if (act === "copy") {
      navigator.clipboard?.writeText(chat.messages[chat.messages.length - 1].content);
      toast("コピーしました");
    }
  };

  function submit() {
    const text = input.value.trim();
    if (!text || streaming) return;
    chat.messages.push({ role: "user", content: text, ts: Date.now() });
    chat.updatedAt = Date.now();
    save();
    input.value = "";
    autoGrow();
    respond();
  }

  function regenerate() {
    if (streaming) return;
    const last = chat.messages[chat.messages.length - 1];
    if (last?.role !== "assistant") return;
    chat.messages.pop();
    respond();
  }

  async function respond() {
    streaming = new AbortController();
    const reply = { role: "assistant", content: "", ts: Date.now() };
    renderMessages();
    msgs.insertAdjacentHTML(
      "beforeend",
      `<div class="msg assistant" id="live">${avatar(c, 36)}<div class="col"><span class="speaker">${esc(c.name)}</span><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div></div></div>`,
    );
    scrollDown();
    const bubble = $("#live .bubble");

    try {
      if (!aiReady()) throw new Error("ローカルAIが設定されていません。「マイページ」の「ローカルAIの設定」で、URLとモデル名を入れてください。");
      const character = { name: c.name, intro: c.intro, personality: c.personality, scenario: c.scenario };
      const history = chat.messages.filter((m) => !m.error && m.content?.trim()).map(({ role, content }) => ({ role, content }));
      if (history[0]?.role === "assistant") history.unshift({ role: "user", content: "(会話を始める)" });
      const res = await fetch(store.ai.url.replace(/\/+$/, "") + "/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(store.ai.key ? { Authorization: `Bearer ${store.ai.key}` } : {}) },
        body: JSON.stringify({
          model: store.ai.model,
          stream: true,
          temperature: Number(store.ai.temperature) || 0.8,
          messages: [{ role: "system", content: buildSystemPrompt(character, store.persona) }, ...history],
        }),
        signal: streaming.signal,
      });
      if (!res.ok || !res.body) throw new Error(`ローカルAIにつながりませんでした(HTTP ${res.status})。URL・モデル名と、AIが起動しているかを確かめてください`);

      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") continue;
          let j;
          try {
            j = JSON.parse(data);
          } catch {
            continue;
          }
          if (j.error) throw new Error(j.error.message || String(j.error));
          const piece = j.choices?.[0]?.delta?.content || "";
          if (piece) {
            reply.content += piece;
            bubble.innerHTML = formatText(reply.content);
            scrollDown();
          }
        }
      }
      if (!reply.content.trim()) throw new Error("返信が空でした");
    } catch (err) {
      if (err.name === "AbortError") return;
      reply.error = true;
      const msg = err.message === "Failed to fetch" ? "ローカルAIにつながりませんでした。AIが起動しているか、URLが合っているかを確かめてください(Ollama の場合は「マイページ」の注意も見てください)" : err.message;
      reply.content = (reply.content ? reply.content + "\n\n" : "") + `⚠️ ${msg || "通信エラー"}`;
    } finally {
      streaming = null;
    }
    chat.messages.push(reply);
    chat.updatedAt = Date.now();
    save();
    // 画面遷移していなければ再描画
    if (document.body.contains(msgs)) {
      renderMessages();
      autoGrow();
    }
  }
}

    ? { ...editing }

  view.innerHTML = `
    <div class="header">${editing ? `<button class="icon-btn" onclick="history.back()">‹</button>` : ""}<h1>${editing ? "キャラクターを編集" : "キャラクター作成"}</h1></div>

        <label>アイコン</label>
        <div class="avatar-picker">

              <button type="button" class="btn" id="upload">画像</button></div>
            <div class="swatches">${COLORS.map((col) => `<button type="button" class="swatch" data-c="${col}" style="background:${col}"></button>`).join("")}</div>

          </div>
        </div>
      </div>

      <div class="field"><label>一言紹介 *</label><div class="hint">カードに表示される短い紹介文</div>
        <input id="intro" required maxlength="80" placeholder="例：クールで口数の少ない生徒会長" value="${esc(draft.intro)}"></div>
      <div class="field"><label>性格・設定</label><div class="hint">年齢、口調、一人称、好きなもの、秘密など。詳しいほど個性が出ます</div>
        <textarea id="personality" rows="5" placeholder="例：一人称は「私」。淡々と話すが照れると言葉に詰まる。">${esc(draft.personality)}</textarea></div>
      <div class="field"><label>世界観・状況</label>
        <textarea id="scenario" rows="3" placeholder="例：放課後の生徒会室で二人きり。">${esc(draft.scenario)}</textarea></div>
      <div class="field"><label>最初のセリフ</label><div class="hint">*アスタリスク* で囲むと行動描写になります</div>
        <textarea id="firstMessage" rows="3" placeholder="例：*書類から目を上げずに* ……遅い。">${esc(draft.firstMessage)}</textarea></div>
      <div class="field"><label>ジャンル</label>
        <div class="chips" style="padding:0;flex-wrap:wrap">${GENRES.slice(1).map((g) => `<button type="button" class="chip" data-tag="${g}">${g}</button>`).join("")}</div></div>
      <button class="btn primary block" type="submit">${editing ? "保存する" : "作成して話しかける"}</button>
      ${editing ? `<button class="btn danger block" type="button" id="del">このキャラクターを削除</button>` : ""}
    </form>`;

  const refreshPreview = () => {
    $("#preview").innerHTML = avatar(draft, 80);
    view.querySelectorAll(".swatch").forEach((s) => s.classList.toggle("active", s.dataset.c === draft.color));
    view.querySelectorAll("[data-tag]").forEach((t) => t.classList.toggle("active", draft.tags.includes(t.dataset.tag)));
  };
  refreshPreview();

  $("#emoji").oninput = (e) => {
    draft.emoji = e.target.value || "✨";
    draft.image = "";
    refreshPreview();
  };
  view.querySelectorAll(".swatch").forEach(
    (s) =>
      (s.onclick = () => {
        draft.color = s.dataset.c;
        refreshPreview();
      }),
  );
  view.querySelectorAll("[data-tag]").forEach(
    (t) =>
      (t.onclick = () => {
        const g = t.dataset.tag;
        draft.tags = draft.tags.includes(g) ? draft.tags.filter((x) => x !== g) : [...draft.tags, g];
        refreshPreview();
      }),
  );
  $("#upload").onclick = () => $("#file").click();
  $("#file").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    draft.image = await resizeImage(f, 256);
    refreshPreview();
  };

  $("#form").onsubmit = (e) => {
    e.preventDefault();
    for (const k of ["name", "intro", "personality", "scenario", "firstMessage"]) draft[k] = $("#" + k).value.trim();
    if (!draft.name || !draft.intro) return toast("名前と紹介文は必須です");
    if (editing) {
      Object.assign(editing, draft);
      save();
      toast("保存しました");
      history.back();

      const c = { ...draft, id: `u-${Date.now().toString(36)}`, createdAt: Date.now() };

      save();
      go(`#/chat/${c.id}`);
    }
  };
  $("#del")?.addEventListener("click", () => {
    if (!confirm(`${editing.name}を削除しますか？会話履歴も消えます。`)) return;
    store.characters = store.characters.filter((c) => c.id !== editing.id);
    delete store.chats[editing.id];
    save();
    go("#/me");
  });
}

function resizeImage(file, size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const s = Math.min(img.width, img.height);
      canvas.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// ---------- マイページ ----------
function renderMe() {
  const p = store.persona;
  const totalMsgs = Object.values(store.chats).reduce((n, ch) => n + ch.messages.filter((m) => m.role === "user").length, 0);
  view.innerHTML = `
    <div class="header"><h1>マイページ</h1></div>
    <div class="profile-card">${avatar({ emoji: "🙂", color: "#2d2939" }, 64)}
      <div><div style="font-weight:700;font-size:18px">${esc(p.name || "名無しさん")}</div><div class="muted" style="font-size:13px">${esc(p.profile || "プロフィール未設定")}</div></div></div>
    <div class="stat-row">
      <div class="stat"><b>${store.characters.length}</b><span>作ったキャラ</span></div>
      <div class="stat"><b>${Object.keys(store.chats).length}</b><span>会話したキャラ</span></div>
      <div class="stat"><b>${totalMsgs}</b><span>送ったメッセージ</span></div>
    </div>
    <div class="section"><div class="section-title">ペルソナ設定</div></div>
    <form class="form" id="persona">
      <div class="field"><label>キャラから呼ばれる名前</label><input id="pname" maxlength="20" placeholder="例：ユウ" value="${esc(p.name)}"></div>
      <div class="field"><label>あなたのプロフィール</label><div class="hint">キャラクターはこの設定をもとにあなたと接します</div>
        <textarea id="pprofile" rows="3" placeholder="例：高校2年生。写真部。">${esc(p.profile)}</textarea></div>
      <button class="btn primary block">保存</button>
    </form>
    <div class="section"><div class="section-title">ローカルAIの設定</div></div>
    <form class="form" id="aiform">
      <div class="field"><label>つなぎ先</label>
        <div class="hint">セフィロスコードが使っているローカルAIを選ぶか、URLを直接入れてください</div>
        <div class="chips">${Object.entries(AI_PRESETS).map(([k, v]) => `<button type="button" class="chip" data-preset="${k}">${v.label}</button>`).join("")}</div>
        <input id="aiurl" placeholder="http://localhost:11434/v1" value="${esc(store.ai.url)}"></div>
      <div class="field"><label>モデル名</label><div class="hint">「モデル一覧を読み込む」で選べます</div>
        <input id="aimodel" list="aimodels" placeholder="例:llama3.1" value="${esc(store.ai.model)}"><datalist id="aimodels"></datalist></div>
      <div class="field"><label>APIキー(ふつうは空でOK)</label><input id="aikey" type="password" value="${esc(store.ai.key)}"></div>
      <div class="field"><label>返事の自由さ(temperature) ${esc(String(store.ai.temperature))}</label><input id="aitemp" type="range" min="0" max="1.5" step="0.1" value="${esc(String(store.ai.temperature))}"></div>
      <div style="display:flex;gap:8px"><button type="button" class="btn block" id="aitest">🔌 モデル一覧を読み込む</button><button class="btn primary block">保存</button></div>
      <p class="hint" id="aimsg">Ollama をブラウザから使うときは、環境変数 OLLAMA_ORIGINS に * を設定して Ollama を起動し直すと、つながるようになります。</p>
    </form>
    <div class="section"><div class="section-title">マイキャラクター</div>
      ${store.characters.length ? `<div class="grid">${store.characters.map(characterCard).join("")}</div>` : `<p class="muted" style="font-size:14px">まだキャラクターを作っていません。</p>`}
    </div>
    <div class="section" style="margin-top:32px"><button class="btn danger block" id="wipe">すべてのデータを削除</button></div>`;

  $("#persona").onsubmit = (e) => {
    e.preventDefault();
    store.persona = { name: $("#pname").value.trim(), profile: $("#pprofile").value.trim() };
    save();
    toast("保存しました");
    renderMe();
  };
  view.querySelectorAll("[data-preset]").forEach((b) => (b.onclick = () => ($("#aiurl").value = AI_PRESETS[b.dataset.preset].url)));
  $("#aitemp").oninput = (e) => (e.target.previousElementSibling.textContent = `返事の自由さ(temperature) ${e.target.value}`);
  $("#aiform").onsubmit = (e) => {
    e.preventDefault();
    store.ai = { url: $("#aiurl").value.trim(), model: $("#aimodel").value.trim(), key: $("#aikey").value, temperature: Number($("#aitemp").value) };
    save();
    toast("ローカルAIの設定を保存しました");
  };
  $("#aitest").onclick = async () => {
    const url = $("#aiurl").value.trim().replace(/\/+$/, "");
    $("#aimsg").textContent = "読み込み中…";
    try {
      const key = $("#aikey").value;
      const r = await fetch(url + "/models", { headers: key ? { Authorization: `Bearer ${key}` } : {} });
      const j = await r.json();
      const ids = (j.data || j.models || []).map((m) => m.id || m.name).filter(Boolean);
      $("#aimodels").innerHTML = ids.map((id) => `<option value="${esc(id)}">`).join("");
      if (ids.length && !$("#aimodel").value) $("#aimodel").value = ids[0];
      $("#aimsg").textContent = ids.length ? `✅ つながりました。モデル ${ids.length} 個: ${ids.slice(0, 6).join(", ")}${ids.length > 6 ? " …" : ""}` : "つながりましたが、モデルが見つかりませんでした。モデル名を直接入れてください。";
    } catch {
      $("#aimsg").textContent = "❌ つながりませんでした。ローカルAIが起動しているか、URL が合っているか確かめてください。Ollama の場合は OLLAMA_ORIGINS=* を設定して起動し直してください。";
    }
  };
  view.querySelectorAll(".card").forEach((el) => (el.onclick = () => openDetail(el.dataset.id)));
  $("#wipe").onclick = () => {
    if (!confirm("キャラクター・会話履歴・ペルソナをすべて削除しますか？")) return;
    localStorage.removeItem(KEY);
    location.reload();
  };
}

route();

</script>
</body>
</html>
