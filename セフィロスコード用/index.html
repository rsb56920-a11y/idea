<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>追加アプリ(セフィロスコード)</title>
<style>
  :root { --bg: #0e0d14; --card: #191726; --line: #2e2a42; --text: #f2f0fa; --muted: #a29cbd; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(800px 500px at 10% -10%, rgba(139, 92, 246, 0.25), transparent 60%), radial-gradient(800px 500px at 100% 0%, rgba(236, 72, 153, 0.2), transparent 60%), var(--bg); color: var(--text); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 26px; margin: 0 0 6px; } p { color: var(--muted); line-height: 1.7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 20px; }
  a.card { display: block; padding: 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: transform 0.2s, border-color 0.2s; }
  a.card:hover { transform: translateY(-3px); border-color: #8b5cf6; }
  .card b { display: block; font-size: 20px; margin: 8px 0 4px; } .card span { font-size: 40px; }
</style>
</head>
<body>
<main>
  <h1>⚔️ 追加アプリ</h1>
  <p>セフィロスコードに追加した、ブラウザで動くアプリです。どれもこのパソコンの中だけで動きます。</p>
  <div class="grid">
    <a class="card" href="ZETA風チャット.html"><span>💬</span><b>キャラクターチャット</b><p>ZETA風。キャラを作って会話。ローカルAIにつないで使います(はじめに「マイページ」で設定)。</p></a>
    <a class="card" href="画像から動画.html"><span>🎬</span><b>画像から動画</b><p>写真を入れて「お願い」を書くだけで動画に。なぞった所だけ動かすこともできます。</p></a>
  </div>
</main>
</body>
</html>
