<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>ちびカナタ PNGTuber</title>
<!-- OBS のブラウザソース用(幅 500 × 高さ 900、背景は透明)。Python なしで動きます。
     口パク: OBS の「マイク」の音量(OBS WebSocket 経由)/ まばたき: 自動 / 表情: 操作パネル か 大声で自動おこ顔 -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .chibi { position: absolute; inset: 0; transform-origin: 50% 100%; }
  .chibi-frame { position: absolute; left: 50%; bottom: 0; height: 96%; transform: translateX(-50%); transition: opacity 0.1s; filter: drop-shadow(0 8px 14px rgba(10, 5, 30, 0.5)); }
  .status { position: absolute; left: 8px; top: 8px; font: 14px "Yu Gothic UI", "Meiryo", sans-serif; color: #fff; background: rgba(180, 40, 60, 0.85); padding: 4px 10px; border-radius: 8px; }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .star { position: absolute; font-size: 34px; color: #ffecaa; text-shadow: 0 0 10px #ffecaa; animation: fly 1.4s ease-out forwards; }
  @keyframes fly { from { opacity: 1; transform: translate(0, 0) scale(0.6); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(120deg); } }
</style>
<script src="設定.js"></script>
<script src="common/kanata.js"></script>
</head>
<body>
  <div class="chibi" id="chibi"></div>
  <div class="fx" id="fx"></div>
  <div class="status" id="status" hidden></div>
<script>
  const ch = K.chibi(document.getElementById("chibi"), {
    open_closed: "img/chibi_open_closed.png",
    blink_closed: "img/chibi_blink_closed.png",
    open_talk: "img/chibi_open_talk.png",
    blink_talk: "img/chibi_blink_talk.png",
    angry: "img/chibi_angry.png",
    sad: "img/chibi_sad.png",
  }, { bob: 4, breathe: 0.012, talkBounce: 6 });

  // フォローなどのうれしいことがあったら、まわりに星を飛ばす
  function sparkle(n = 10) {
    const fx = document.getElementById("fx");
    for (let i = 0; i < n; i++) {
      const s = document.createElement("div");
      s.className = "star";
      s.textContent = "✦";
      s.style.left = 30 + Math.random() * 40 + "%";
      s.style.top = 20 + Math.random() * 30 + "%";
      s.style.setProperty("--dx", (Math.random() - 0.5) * 300 + "px");
      s.style.setProperty("--dy", -Math.random() * 250 + "px");
      fx.appendChild(s);
      setTimeout(() => s.remove(), 1500);
    }
  }

  const status = document.getElementById("status");
  K.connectChibi(ch, {
    onStatus(st) {
      // 配信に映らないよう、つながっている時は何も出さない
      status.hidden = st === "ok";
      status.textContent = st === "auth" ? "OBSのパスワードがちがうよ(設定.js)" : "OBSにつないでいます…";
    },
    // フォロー・レイドなどでキラキラ
    onKanata(d) {
      if (["follow", "raid", "sub", "cheer"].includes(d.type)) sparkle(14);
    },
  });
  K.loop((t) => ch.update(t));
</script>
</body>
</html>
